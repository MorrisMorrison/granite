name: Android

on:
  pull_request:
    paths: ['apps/mobile/**', 'packages/shared/**', 'pnpm-lock.yaml', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-apk:
    name: Android debug APK
    runs-on: ubuntu-latest # PUBLIC repo -> GitHub-hosted only
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: corepack pnpm install --frozen-lockfile
      # The committed Android project references files generated by `cap sync`
      # (capacitor.build.gradle, capacitor.settings.gradle), so sync before Gradle.
      - name: Build web + sync into the Android project
        run: corepack pnpm --filter mobile run cap:sync
      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: granite-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
