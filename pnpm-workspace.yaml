packages:
  - apps/*
  - packages/*

# Permit these dependencies' install build scripts to run (the Astro/Starlight docs
# site needs them: esbuild fetches its platform binary, sharp builds image support).
# pnpm blocks unreviewed build scripts by default (strictDepBuilds) and a frozen
# install errors with ERR_PNPM_IGNORED_BUILDS otherwise.
allowBuilds:
  esbuild: true
  sharp: true

# Security overrides for transitive deps whose parent pins a vulnerable version.
# Drop each entry once the parent ships a release with the fix.
overrides:
  # httpsnippet (via starlight-openapi, docs site) pins form-data 4.0.4
  # (GHSA-hmw2-7cc7-3qxx, fixed in 4.0.6).
  httpsnippet>form-data: ^4.0.6
